<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Fadara Football Agency</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container">
            <div class="logo">Fadara SPORTS</div>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About Us</a></li>
                    <li><a href="contact.html">Contact Us</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section id="contact">
        <h2 class="section-title">Contact Us</h2>
        <div class="contact-wrap">
            <div class="contact-info">
                <h3>Get in touch</h3>
                <p>Players, parents and clubs are welcome to reach out.</p>
                <br>
                <p><strong>Email:</strong> <a href="mailto:danielbundu53@gmail.com">danielbundu53@gmail.com</a></p>
                <p><strong>Offices:</strong> Sierra Leone, Liberia, Guinea</p>
            </div>
            <form class="contact-form" action="mailto:danielbundu53@gmail.com" method="post" enctype="text/plain">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required>
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="6" required></textarea>
                <button type="submit" class="btn">Send Message</button>
            </form>
        </div>
    </section>

    <footer>
        <p>&copy; 2025 FADARA Sports Management. All Rights Reserved.</p>
    </footer>
</body>
</html>
